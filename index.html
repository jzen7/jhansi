<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jhanusha Wrapped</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b1033;--cream:#fff7ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--ink);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#1b1033;--cream:#fff7ea}}
:root[data-theme="dark"]{--ink:#1b1033;--cream:#fff7ea}
html,body{height:100%;margin:0}
*,*::before,*::after{box-sizing:inherit}
body{background:var(--ink);color:var(--cream);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;transition:background .45s ease,color .45s ease;overflow-x:hidden}
main{min-height:100%;max-width:640px;margin:0 auto;padding:32px 24px;display:flex;flex-direction:column;justify-content:center;gap:24px}
h1{margin:0;font-weight:800;font-size:clamp(2.3rem,9.5vw,4.4rem);line-height:1.02;letter-spacing:-.025em}
p{margin:0;font-size:clamp(1.1rem,4.2vw,1.45rem);font-weight:500;line-height:1.4;max-width:30ch}
.pop{animation:pop .4s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{transform:scale(.94) translateY(10px);opacity:0}to{transform:none;opacity:1}}
button{align-self:flex-start;font:inherit;font-weight:800;font-size:1.15rem;padding:16px 30px;border:0;border-radius:999px;cursor:pointer;background:currentColor;transition:transform .15s}
button span{color:var(--bg)}
button:active{transform:scale(.94)}
button:focus-visible{outline:3px solid currentColor;outline-offset:4px}
.bar{height:14px;border-radius:99px;border:2px solid currentColor;overflow:hidden;max-width:360px}
.bar i{display:block;height:100%;width:0;background:currentColor;transition:width 3.2s cubic-bezier(.5,0,.3,1)}
img.pic{width:100%;max-width:340px;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block;box-shadow:0 14px 34px rgba(27,16,51,.35)}
h1.sm{font-size:clamp(1.8rem,7vw,2.6rem)}
ol.songs{list-style:none;margin:0;padding:0;display:grid;gap:10px;max-width:420px;counter-reset:s}
ol.songs li{counter-increment:s;display:flex;gap:12px;align-items:baseline;border-top:2px solid currentColor;padding-top:10px}
ol.songs li::before{content:counter(s);min-width:1.1em;font-weight:500;opacity:.7}
ol.songs b{font-weight:800;font-size:1.05rem;flex:1}
ol.songs span{font-size:.85rem;font-weight:500;opacity:.75;white-space:nowrap}
p.note{max-width:34ch}
#ytwrap{position:fixed;left:0;bottom:0;width:1px;height:1px;opacity:0;pointer-events:none;overflow:hidden}
#snd{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;z-index:5;width:44px;height:44px;padding:0;font-size:1.1rem;background:rgba(0,0,0,.28);color:#fff}
#snd[hidden]{display:none}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
@media (prefers-reduced-motion:reduce){.pop{animation:none}.bar i{transition:none}}
</style>
</head>
<body>
<main id="card" aria-live="polite"></main>
<canvas id="c"></canvas>
<div id="ytwrap"><div id="yt"></div></div>
<button id="snd" aria-label="Mute or unmute music" hidden>🔊</button>

  card.innerHTML=(s.final?'<img class="pic pop" alt="Jhanusha in her graduation gown" src="'+PIC+'">':'')+'<h1 class="pop'+(s.final?' sm':'')+'"></h1>'+(s.small?'<p class="pop"></p>':'')+(s.songs?'<ol class="songs pop">'+s.songs.map(x=>'<li><b>'+x[0]+'</b><span>'+x[1]+'</span></li>').join('')+'</ol>':'')+(s.note?'<p class="pop note"></p>':'')+(s.load?'<div class="bar"><i></i></div>':'')+(s.btn?'<button class="pop"><span></span></button>':'');
  card.querySelector('h1').textContent=s.big;
  if(s.small)card.querySelector('p').textContent=s.small;if(s.note)card.querySelector('p.note').textContent=s.note;
  if(s.btn){const b=card.querySelector('button');b.querySelector('span').textContent=s.btn;b.style.background=s.fg;b.onclick=()=>{if(S[i+1]&&S[i+1].final)music();if(s.final){confetti();}else{i++;show();}};b.focus({preventScroll:true});}
  if(s.load){requestAnimationFrame(()=>requestAnimationFrame(()=>card.querySelector('.bar i').style.width='100%'));const lb=card.querySelector('button');lb.style.visibility='hidden';setTimeout(()=>{lb.style.visibility='visible';lb.focus({preventScroll:true});},3500);}
  if(s.final)confetti();
}
function confetti(){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const c=document.getElementById('c'),x=c.getContext('2d');
  c.width=innerWidth;c.height=innerHeight;
  const cols=['#1b1033','#fff7ea','#c8f169','#ffc933','#6ec6ff'];
  const P=Array.from({length:140},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,w:6+Math.random()*7,h:10+Math.random()*8,vy:2+Math.random()*4,vx:-1.5+Math.random()*3,r:Math.random()*6,vr:-.2+Math.random()*.4,c:cols[Math.random()*cols.length|0]}));
  const end=Date.now()+4500;
  (function f(){
    x.clearRect(0,0,c.width,c.height);
    P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore();});
    if(Date.now()<end)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height);
  })();
}
let yt=null,playing=false,muted=false;
window.onYouTubeIframeAPIReady=function(){try{yt=new YT.Player('yt',{videoId:'ACnSAKEF4q4',width:'1',height:'1',playerVars:{playsinline:1,loop:1,playlist:'ACnSAKEF4q4',controls:0,rel:0}});}catch(e){}};
try{const t=document.createElement('script');t.src='https://www.youtube.com/iframe_api';document.head.appendChild(t);}catch(e){}
function music(){try{if(yt&&yt.playVideo&&!playing){yt.playVideo();playing=true;document.getElementById('snd').hidden=false;}}catch(e){}}
document.getElementById('snd').onclick=function(){try{if(muted){yt.unMute();this.textContent='\uD83D\uDD0A';}else{yt.mute();this.textContent='\uD83D\uDD07';}muted=!muted;}catch(e){}};
show();
</script>
